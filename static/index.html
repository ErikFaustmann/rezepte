<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rezepte</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="kopf">
    <a href="#/" class="logo">🍲 Rezepte</a>
    <form id="import-form" class="import">
      <input id="import-url" type="url" placeholder="Rezept-URL einfügen, z. B. https://www.chefkoch.de/rezepte/…" required>
      <button type="submit">Importieren</button>
    </form>
    <a href="#/neu" class="knopf zweitrangig">+ Neu</a>
    <button id="nutzer-btn" class="zweitrangig" title="Deinen Namen ändern"></button>
  </header>
  <div id="meldung" class="meldung" hidden></div>
  <main id="app"></main>
  <footer id="fuss" class="fuss"></footer>
  <script src="/static/app.js"></script>
</body>
</html>
